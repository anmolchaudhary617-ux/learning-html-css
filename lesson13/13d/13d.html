<!DOCTYPE html>
<html>

<head>
  <title>Practice flexbox part 7</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
  rel="stylesheet">
  <style>
    body {
      font-family: Arial, sans-serif;
    }

    div, p {
      margin: 0;
    }

    .container {
      margin-left: 40px;
      margin-top: 40px;
      display: flex;
      flex-direction: column;
      box-shadow: 0px 0px 4px 2px rgba(0, 0, 0, 0.3);
      width: 380px;
      padding-top: 10px;
      padding-left: 17px;
      padding-right: 20px;
      padding-bottom: 33px;
    }

    .header {
      color: gray;
      margin-bottom: 20px;
    }

    .email {
      display: flex;
    }

    .sender-profile {
      display: flex;
      align-items: center;
    }

    .sender-profile-img {
      width: 55px;
      height: 55px;
      object-fit: cover;
      border-radius: 50%;
    }

    .mail-content {
      margin-left: 17px;
      line-height: 1.5;
    }

    .mail-sender {
      display: inline-block;
      font-weight: 700;
    }

    .time {
      color: gray;
      display: inline-block;
      margin-left: 58px;
    }

    .mail-subject {
      font-weight: 700;
    }    

    .mail-description {
      color: gray;
    }
  </style>
  <link rel="stylesheet" href="13d.css">
</head>

<body>
  <div class="container">
    <div class="header">
    ALL INBOXES
  </div>
  <div class="email">
    <div class="sender-profile">
      <img src=mail-sender.jpg class="sender-profile-img">
    </div>
    <div class="mail-content">
      <div class="mail-title">
        <p class="mail-sender">
          Gulli Bail Bakchdi Ltd.
        </p>
        <p class="time"> 00:02 AM</p>
      </div>
      <div class="mail-subject">
        Happy Birthday Dogesh!
      </div>
      <div class="mail-description">
        जन्मदिन की शुभकामनाएँ! पार्टी कब दे रहे हैं?...
      </div>
    </div>
  </div>
  </div>
</body>

</html>
