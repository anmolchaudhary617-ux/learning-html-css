<!DOCTYPE html>
<html>

<head>
  <title>Practicing div-V</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet">
  <style>
    p,
    button,
    img {
      font-family: Roboto;
      display: inline-block;
    }

    .box {
      vertical-align: middle;
      border: 1.4px solid rgba(0, 0, 0, 0.2);
      border-radius: 5px;
      width: 400px;
      height: 70px;
      padding: 5px;
    }

    .box::shadow {
      box-shadow: 3px 4px 1 rgba(0, 0, 0, 0.15);
    }

    .logo {
      width: 60px;
      height: 60px;
      border-radius: 30px;
      object-fit: cover;
      margin-top: 5px;
      margin-left: 5px;
    }

    .text {
      vertical-align: middle;
      margin-bottom: 70px;
      margin-left: 7px;
      color: gray;
    }

    .tweet {
      vertical-align: middle;
      margin-left: 113px;
      margin-bottom: 50px;
      background-color: rgb(38, 132, 226);
      border: none;
      border-radius: 15px;
      padding: 5px 10px;
      font-weight: bold;
      color: white;
    }

    .tweet::shadow {
      box-shadow: 3px 4px 1 rgba(0, 0, 0, 0.9);
    }
  </style>
</head>

<body>
  <div class="box">
    <img class="logo" src="cat-image.jpg" alt="An image of a cat">
    <p class="text">
      What's happening?
    </p>
    <button class="tweet">
      Tweet
    </button>
  </div>
</body>

</html>
