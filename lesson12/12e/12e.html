<!DOCTYPE html>
<html>

<head>
  <title>Practicing flexbox part 5</title>
  <link rel="stylesheet" href="12e.css">
  <style>
    div {
      font-family: Arial, sans-serif;
      font-weight: 380;
    }

    .container {
      width: 280px;
      padding: 7px 12px;
      margin-left: 20px;
      margin-top: 20px;
      border: 1.2px;
      border-style: solid;
      border-color: rgba(128, 128, 128, 0.2);
      border-radius: 7px;
    }
    .design{
      padding-bottom: 10px;   
    } 

    .design, .design-message{
      display: flex;
      flex-direction: row;
      justify-content: space-between;
    }

    .number {
      background-color: rgb(16, 94, 211);
      border: none;
      border-radius: 10px;
      color: white;
      font-family: Arial, sans-serif;
      padding: 2px 8px; 
      font-weight: 550;
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="design">
      Home
      <button class="number">
        14
      </button>
    </div>
    <div class="design">
      Notifications
      <button class="number">
        3
      </button>
    </div>
    <div class="design-message">
      Messages
      <button class="number">
        5
      </button>
    </div>
  </div>
</body>

</html>
