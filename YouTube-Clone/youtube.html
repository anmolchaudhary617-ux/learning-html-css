<!DOCTYPE html>
<html>

<head>
  <title>YouTube-Clone</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet">
  <style>
    p {
      margin: 0;
      font-family: Roboto, Arial;
    }

    .thumbnail {
      width: 254px;
    }

    .searchbox {
      display: block;
    }

    .channel-author {
      display: inline-block;
      width: 48px;
      height: 102.8px;
      vertical-align: top;
      margin-top: 10px;
    }

    .author {
      width: 36px;
      height: 36px;
      border-radius: 18px;
    }

    .video-info {
      display: inline-block;
      width: 206px;
      margin-top: 10px;
    }

    .video-title {
      font-size: 14px;
      font-weight: 500;
      line-height: 20px;
    }

    .video-author,
    .video-stats {
      font-size: 12px;
      color: rgb(96, 96, 96);
    }

    .video-author {
      margin-top: 10px;
    }

    .video-stats {
      margin-top: 4px;
    }

    .video {
      display: inline-block;
      width: 262px;
      vertical-align: top;
    }
  </style>
</head>

<body>
  <input type="text" class="searchbox" placeholder="Search">
  <div class="video">
    <div class="video-img"> <img src="thumbnails/thumbnail-1.png" class="thumbnail"> </div>
    <div class="video-description">
      <div class="channel-author">
        <img class="author" src="profilepictures/channel-1.jpeg" alt="channel-author">
      </div>
      <div class="video-info">
        <p class="video-title">
          Talking Tech and AI with Google CEO Sundar Pichai!
        </p>
        <p class="video-author">
          Marques Brownlee
        </p>
        <p class="video-stats">
          3.4 million views &middot; 6 months ago
        </p>
      </div>
    </div>
  </div>

  <div class="video">
    <div class="video-img"> <img src="thumbnails/thumbnail-2.png" class="thumbnail"> </div>
    <div class="video-description">
      <div class="channel-author">
        <img class="author" src="profilepictures/channel-2.jpeg" alt="channel-author">
      </div>
      <div class="video-info">
        <p class="video-title">
          Try Not To Laugh Challenge #9
        </p>
        <p class="video-author">
          Markiplier
        </p>
        <p class="video-stats">
          19 million views &middot; 4 years ago
        </p>
      </div>
    </div>
  </div>
</body>

</html>
