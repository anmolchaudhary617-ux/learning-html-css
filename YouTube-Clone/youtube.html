<!DOCTYPE html>
<html>

<head>
  <title>YouTube-Clone</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet">
  <style>
    .thumbnail {
      width: 254px;
    }

    .video1 {
      width: 262px;
    }

    .searchbox {
      display: block;
    }


    .video1,
    .video2 {
      display: inline-block;
    }
  </style>
</head>

<body>
  <input type="text" class="searchbox" placeholder="Search">
  <div class="video1">
    <div class="video-img"> <img src="thumbnails/thumbnail-1.png" class="thumbnail"> </div>
    <div class="video-description">
      <p class="video-title">
        Talking Tech and AI with Google CEO Sundar Pichai!
      </p>
      <p class="video-author">
        Marques Brownlee
      </p>
      <p class="video-stats">
        3.4 million views &middot; 6 months ago
      </p>
    </div>
  </div>

  <div class="video2">
    <img src="thumbnails/thumbnail-2.png" class="thumbnail">
    <p class="video-title">
      Try Not To Laugh Challenge #9
    </p>
    <p class="video-author">
      Markiplier
    </p>
    <p class="video-stats">
      19 million views &middot; 4 years ago
    </p>
  </div>
  </div>
</body>

</html>
